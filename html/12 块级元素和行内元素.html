<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>块级元素和行内元素</title>
</head>
<body>
    <!-- 块级元素：独占一行 -->
    <marquee>hello world</marquee>
    <marquee>hello world</marquee>
    <h1>title</h1>
    <h1>title</h1>
    <p>paragraph</p>
    <p>paragraph</p>
    <div>word</div>
    <div>word</div>
    <!-- 行内元素：不独占一行 -->
    <input type="text">
    <input type="text">
    <!-- 规则1：块级元素内几乎什么都能写，行内元素块级元素 -->
    <!-- 规则2：行内元素中能写行内元素，不能写块级元素 -->
     <!-- 特殊规则：h1-h6不能互相嵌套 -->
      <!-- 特殊规则：p标签中不能写块元素 -->
</body>
</html>
