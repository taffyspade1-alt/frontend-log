<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>超链接跳转锚点</title>
</head>
<body>
    <!-- 具有href属性的a标签是超链接，具有name属性的a标签是锚点 -->
    <!-- name和id都区分大小写，且id最好别用数字开头 -->
    <a href="#5t5">我没意见</a>
    <a href="#castorice">遐蝶</a>    
    <a name="5t5"></a>
    <p>会赢的</p>
    <img src="./content1/五条牢师.jpg" alt="">
    <p>请你做好被引力撕裂的准备吧！</p>
    <img src="./content1/老杨.png" alt="">
    <p id="castorice">你醒了?</p>
    <img src="./path_test/a/你醒了？.png" alt="">
    <a href="#">回到顶部</a>
    <a href="">刷新页面</a>
    <a href="javascript:alert(666);">弹窗666</a>
</body>
</html>
