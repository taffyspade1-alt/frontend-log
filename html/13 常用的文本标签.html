<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>常用的文本标签</title>
</head>
<body>
    <!-- em:着重阅读的内容-->
    <P>
        预防电信诈骗，请安装<em>国家反诈中心APP</em>
    </P>
    <!-- strong：十分重要的内容，优先级比em更高 -->
    <p>
        当我们出门时，一定要<strong>关好门窗</strong>！
    </p>
    <!-- span：没有语义，用于包裹短语的通用容器 -->
     <p>
        前端的框架为：<span>Angular,React,Vue</span>
     </p>
</body>
</html>
