<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>表单</title>
</head>
<body>
    <form action="">
        <!-- 文本输入框 -->
        姓名：<input type="text" name="name"size="10">
        <!-- 单选按钮 -->
        <p>
            性别：
            <input type="radio" name="gender" value="radio" checked>男
            <input type="radio" name="gender" value="radio"> 女
            <!-- 一组的按钮设置为同样的name -->
        </p>
        <!-- 多选按钮 -->
        <p>兴趣
            <input type="checkbox" name="interest">文学
            <input type="checkbox" name="interest">音乐
            <input type="checkbox" name="interest">美术
        </p>
        <!-- 密码输入框 -->
        <p>密码
            <input type="password">
        </p>
        <!-- 按钮 -->
        <p>
            <input type="submit" value="提交"> <input type="reset" value="重置">
        </p>
        <!-- 多行文本框 -->
         <p>
            <textarea name="textarea" id="textarea" cols="45" rows="5"></textarea>
         </p>
         <!-- 下拉列表框 -->
          <p>
            <select name="select" id="select">
                <option value="1">Flash</option>
                <option value="2">Dreamweaver</option>
                <option value="3">Fireworks</option>
                <option value="4">Photoshop</option>
            </select>
          </p>
    </form>
</body>
</html>
