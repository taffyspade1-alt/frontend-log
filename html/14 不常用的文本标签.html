<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>不常用的文本标签</title>
</head>
<body>
    <!-- 
    cite:作品标题
    dfn:专属名词
    del与ins:删除的文本与插入的文本
    sub与sup:上标与下标
    code:一段代码
    samp:从上下文中提取一段内容
    kbd:键盘文本
    abbr:缩写，配合title使用
    bdo:更改文本顺序
    var:标记变量，与code一起使用
    address:地址信息（块元素）
    -->
</body>
</html>
