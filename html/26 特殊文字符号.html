<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>特殊文字符号</title>
</head>
<body>
    <!-- &lt;代表大于号，&gt;代表小于号 -->
    <p>若x &lt; y,则y &gt; x</p>
    <!-- &nbsp;代表空格 -->
    你好                  世界
    你好 &nbsp;&nbsp;&nbsp;世界
    <!-- 上标:sup 下标:sub -->
    <p>x方+y方<br>x<sup>2</sup>+y<sup>2</sup></p>
    <!-- &divide;代表÷ &plusmn;代表± &permil;代表‰ &harr;代表双向箭头 -->
    <p>H<sub>2</sub>+O<sub>2</sub> &harr; H<sub>2</sub>O<sub>2</sub></p>
    <p>1&divide;1 1&plusmn;1 1&permil;</p>
</body>
</html>
