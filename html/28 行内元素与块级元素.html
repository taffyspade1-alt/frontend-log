<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>行内元素与块级元素</title>
</head>
<body>
    <!-- div是一个块级元素 -->
    <p>div标记不同行</p>
    <div><img src="../html/content1/天安门.jpg" width="300px" alt=""></div>
    <div><img src="../html/content1/天安门.jpg" width="300px" alt=""></div>
    <!-- span是一个行内元素 -->
    <p>span标记同一行</p>
    <span><img src="../html/content1/天安门.jpg" width="300" alt=""></span>
    <span><img src="../html/content1/天安门.jpg" width="300" alt=""></span>
</body>
</html>
