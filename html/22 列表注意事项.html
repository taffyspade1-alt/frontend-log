<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>列表注意事项</title>
</head>
<body>
    <h2>把大象放冰箱总共分几步</h2>
       <!-- ol下子元素最好都是li，如果要加其他子元素可以嵌套进li -->
    <ol>
        <li>把冰箱门打开</li>
        <li>把大象放进去</li>
        <li>把冰箱门关上</li>
        <li><a href="www.baidu.com">去百度</a></li>
    </ol>
    <!-- 列表可以嵌套 -->
    <h2>我想去的几个城市</h2>
    <ul>
        <li>
            <span>上海</span>
            <ul>
                <li>上海外滩</li>
                <li>东方明珠</li>
                <li>杜莎夫人蜡像馆</li>
            </ul>
        </li>
        <li>西安</li>
        <li>成都</li>
    </ul>
    <!-- li最好不要单独使用 -->
    <h2>如何更好的学习</h2>
    <!-- dl术语名称 dd术语描述
     一个术语名称可以有多个术语描述 -->
    <dl>
        <dt>做好笔记</dt>
        <dd>笔记是复习的抓手</dd>
        <dd>笔记可以是电子版也可以是纸质版</dd>
        <dt>多加练习</dt>
        <dd>只有敲出来的代码才是自己的</dd>
    </dl>
</body>
</html>
