<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>导入式使用css</title>
    <style type="text/css">
        @import url("06\ 链接式.css");
        @import url("07\ 导入式.css");
    </style>
</head>
<body>
    <!-- 
    常见的导入式语句
    @import url(sheet1.css);
    @import url("sheet1.css")

    @import "sheet1.css"
    @import 'sheet1.css'
     -->
    <h2>标题1</h2>
    <p>内容1</p>
    <h2>标题2</h2>
    <p>内容2</p>
    <h3>标题3</h3>
</body>
</html>
