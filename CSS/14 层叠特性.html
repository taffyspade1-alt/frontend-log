<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>层叠特性</title>
    <style>
        p{
            color: green;
        }
        .red{
            color: red;
        }
        .purple{
            color: purple;
        }
        #line3{
            color: blue;
        }
    </style>
</head>
<body>
    <p>第一行文本</p>
    <p class="red">第二行文本</p>
    <p id="line3">第三行文本</p>
    <p style="color: orange;">第四行文本</p>
    <p class="purple red">第五行文本</p>
    <!-- 优先级规则：行内样>ID样式>类别样式>标记样式 -->
</body>
</html>
