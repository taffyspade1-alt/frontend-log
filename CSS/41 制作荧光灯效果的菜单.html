<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>制作荧光灯效果的菜单</title>
    <style>
        #menu{
            font-size: 14px;
            font-weight: bold;
            width: 120px;
            background: #000;
            border: 1px solid #CCC;
            padding: 8px;
            margin: 0 auto;   /* 设置水平居中 */
            
        }
        #menu a,#menu a:visited{
            display: block;
            padding: 4px 8px;
            color: #CCC;
            text-decoration: none;
            border-top: 8px solid #060;
        }
        #menu a:hover{
            color: #FF0;
            border-top:8px solid #0E0
        }
    </style>
</head>
<body>
    <div id="menu">
        <a href="#">Home</a>
        <a href="#">Contact us</a>
        <a href="#">Web Dev</a>
        <a href="#">Web Design</a>
        <a href="#">Map</a>
    </div>
</body>
</html>
