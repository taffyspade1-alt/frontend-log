<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>在html中使用css的方法</title>
    <!-- 内嵌式 -->
    <style type="text/css">
        p{
            color: aqua;
            text-decoration: underline;
            font-weight: bold;
            font-size: 25px;
        }
    </style>
</head>
<body>
    <!-- 行内式（通常不使用） -->
    <p style="color:aliceblue;font-size: 20px;text-decoration: underline;">内容1</p>
    <p>内容2</p>

</body>
</html>
