<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>设置表格的边框</title>
    <style>
    .record{
        font: 14px;
        border: 2px #777 solid;   /* 整个表格的边框 */
        text-align: center;
        border-collapse: collapse;   /* 边框合并 */
        /* 边框合并优先级 hidden最高 none最低 double>solid>dashed>dotted>ridge>outset>groove>inset */
        border-spacing: 10px;   /* 框线分离 */
    }
    .record td{
        border: 1px #777 dashed;
    }
    .record th{
        border: 1px #777 solid;
    }
    </style>
</head>
<body>
    <table class="record">
    <!-- 表格标题 -->
    <caption>学生信息</caption>
    <!-- 表头 -->
<thead>
    <th>姓名</th>
    <th>性别</th>
    <th>年龄</th>
    <th>民族</th>
    <th>政治面貌</th>
</thead>
<!-- 主体 -->
<tbody>
    <tr>
        <td>张三</td>
        <td>男</td>
        <td>18</td>
        <td>汉族</td>
        <td>团员</td>
    </tr>
    <tr>
        <td>李四</td>
        <td>女</td>
        <td>20</td>
        <td>满族</td>
        <td>群众</td>
    </tr>
    <tr>
        <td>王五</td>
        <td>男</td>
        <td>21</td>
        <td>回族</td>
        <td>党员</td>
    </tr>
    <tr>
        <td>赵六</td>
        <td>女</td>
        <td>21</td>
        <td>壮族</td>
        <td>群众</td>
    </tr>
</tbody>
<!-- 脚注 -->
<tfoot>
<td></td>
<td></td>
<td></td>
<td></td>
<td>总计：4人</td>
</tfoot>
</body>
</html>
