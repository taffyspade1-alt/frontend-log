<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>阴影</title>
    <style>
        #shadow{
            box-shadow: 10px 10px 12px #888;   /* 向右10px，向下10px，柔化12px */
            /* 第一个值：水平阴影，正值向右负值向左 */
            /* 第二个值：垂直阴影，正值向下负值向上 */
            width: 500px;
            height: 100px;
            color: white;
            background-color: gray;
            text-align: center;
            font-size: 20px;
            line-height: 100px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div id="shadow">给一个div块添加阴影</div>
</body>
</html>
