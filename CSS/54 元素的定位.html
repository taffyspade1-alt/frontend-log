<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>position属性</title>
</head>
<body>
    <style>
        body{
            margin: 20px;
            font: Arial 12px;
        }
        #father{
            background-color: #a0c8ff;
            border: 1px dashed #000000;
            padding: 15px;
        }
        #block1{
            background-color: #fff0ac;
            border: 1px dashed #000000;
            padding: 10px;
            position: relative;   /* 相对定位 */
            left: 30px;   /* 移到原来位置右侧30px的地方 */
            top: 30px;   /* 移到原来位置上边框下侧30px的地方 */
        }
    </style>
    </body>
        <div id="father">
            <div id="block1">Box-1</div>
    </div>
    </body>
</html>
