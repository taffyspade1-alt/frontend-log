<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用表格展示产品月销量</title>
    <style>
        h1{
            text-align: center;
        }
        table{
            border-collapse: collapse;
            border: 2px solid #d4d4d4;
            width: 600px;
            height: 180px;
            margin-left: 25%;
        }
        thead tr{
            height: 40px;
        }
        thead,tbody{
            text-align: center;
        }
        tfoot{
            background: #d4d3d3;
            text-align: center;
            height: 40px;
        }
        .special{
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>产品月销量</h1>
    <table border="1">
        <thead>
            <tr>
            <th>ID</th>
            <th>产品名称</th>
            <th>销量</th>
            </tr>
        </thead>
        <tbody>
            <tr>
            <td>2021090901</td>
            <td>马克杯</td>
            <td>5000</td>
            </tr>
            <tr>
                <td>2021090901</td>
                <td>啤酒杯</td>
                <td>5200</td>
            </tr>
            <tr>
                <td>2021090901</td>
                <td>搪瓷杯</td>
                <td>3500</td>
            </tr>
        </tbody>
        <tfoot>
            <th colspan="2" class="special">合计</th>
            <th>13700</th>
        </tfoot>
    </table>
</body>
</html>
