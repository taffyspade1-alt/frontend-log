<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>盒子模型的基本结构</title>
    <style>
        div{
            /* 内容区的宽 */
            width: 400px;
            /* 内容区的高 */
            height: 400px;
            background-color: gray;
            /* 内边距 设置的颜色会填充到内边距 */
            padding: 20px;
            /* 边框 */
            border: 10px dashed black;
            /* 外边距 */
            margin: 50px;
        }
    </style>
</head>
<body>
    <div>
        hello world!
    </div>
</body>
</html>
