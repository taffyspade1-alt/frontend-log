<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>float属性</title>
    <style>
        body{
            margin: 15px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }
        .father{
            background-color: #ffff99;
            border: 1px solid #111111;
            padding: 5px;
        }
        .father div{
            padding: 10px;
            margin: 15px;
            border: 1px dashed #111111;
            background-color: #90baff;
        }
        .father p{
            background-color: #ff90ba;
            border: 1px dashed #111111;
            clear: both;   /* 让这个段落不再围绕浮动框排列，left左，right右，both全部 */
        }
        .son1{
            float: left;
        }
        .son2{
            float: left;
        }
        .son3{
            float: right;
        }
        .father .clear{
            margin: 0;
            padding: 0;
            border: 0;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="father">
        <div class="son1">Box-1</div>
        <div class="son2">Box-2</div>
        <div class="son3">Box-3</div>
        <p>这里是浮动框外围的文字，这里是浮动框外围的文字，这里是浮动框外围的文字，这里是浮动框外围的文字，这里是浮动框外围的文字，
            这里是浮动框外围的文字，这里是浮动框外围的文字，这里是浮动框外围的文字，这里是浮动框外围的文字，这里是浮动框外围的文字。
        </p>
         <!-- 文字内容删除后父div块内容缩小，说明一个div块的范围是由其中的标准流内容决定的，与里面的浮动内容无关 -->
         <div class="clear"></div>   <!-- 添加一个div块使父div的范围包括这三个盒子 -->
    </div>
</body>
</html>
