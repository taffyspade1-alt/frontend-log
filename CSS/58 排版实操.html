<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>排版</title>
    <style>
        body{
            background: #dcdada;
            margin: 0;
        }
        .up{
            background-color: gray;
            width: 100%;
            height: 80px;
            margin-bottom: 10px;
            padding: 0;
        }
        .first{
            width: 15%;
            height: 450px;
            margin: 10px 10px 15px 25px;
            background-color: gray;
            float: left;
        }
        .second{
            width: 48%;
            height: 450px;
            margin: 10px 10px 15px 10px;
            background-color: gray;
            position: absolute;
            left: 17%;
        }
        .third{
            width: 16%;
            height: 450px;
            margin: 10px 10px 15px 10px;
           
        }
        .top{
            width: 15%;
            height: 143.3px;
            margin: 10px;
            background-color: gray;
            position: absolute;
            left: 66%;
            top: 90px;
        }
        .middle{
            width: 15%;
            height: 143.3px;
            margin: 10px;
            background-color: gray;
            position: absolute;
            left: 66%;
            top: 243.3px;
        }
        .bottom{
            width: 15%;
            height: 143.3px;
            margin: 10px;
            background-color: gray;
            position: absolute;
            left: 66%;
            top: 396.6px;            
        }
        .fourth{
            width: 15%;
            height: 450px;
            margin: 10px 25px 15px 10px;
            background-color: gray;
            position: absolute;
            top: 90px;
            right: 0px;
        }
    </style>
</head>
<body>
    <div class="up"></div>
    <div>
        <div class="first"></div>
        <div class="second"></div>
        <div class="third">
            <div class="top"></div>
            <div class="middle"></div>
            <div class="bottom"></div>
        </div>
        <div class="fourth"></div>
    </div>
</body>
</html>
