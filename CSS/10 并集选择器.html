<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>并集选择器</title>
    <style>
    h1,h2,h3,h4.h5,p{     /* 并集选择器 */
        color: purple;
        font-size: 15px;
    }
    h2.special,.special,#one{   /* 集体声明 */
        text-decoration: underline;
    }
    </style>
</head>
<body>
    <h1>标题1</h1>
    <h2 class="special">标题2</h2>
    <h3>标题3</h3>
    <h4>标题4</h4>
    <h5>标题5</h5>
    <p>内容1</p>
    <p class="special">内容2</p>
    <p id="one">内容3</p>
</body>
</html>
