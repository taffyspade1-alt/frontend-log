<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>设置边框border</title>
    <style>
        div{
            border-color: black;
            border-style: dotted;
            border-width: 5px;
            /* 在同一行中设置 */
            border: 2px green dashed;
            /* 单独设置一条边 */
            border-left: 2px solid red;
            /* 后输入的设置会覆盖前面的设置 */
            background-color: skyblue;
        }
    </style>
</head>
<body>
    <div>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Omnis illo culpa ut enim quibusdam, quam expedita sint eligendi vitae odit ipsam? In tempora officiis ullam amet velit, possimus voluptate assumenda?</div>
</body>
</html>
