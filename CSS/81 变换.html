<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>旋转 transform:rotate(xdeg);</p>   <!-- x为正数顺时针旋转，x为负数逆时针旋转 -->
    <p>缩放 transform:scale(x,y)</p>    <!-- scaleX 决定X轴放大，scaleY 决定Y轴放大 -->
    <p>平移 transform:translate(x,y)</p>   <!-- translateX表示水平方向，正值右移负值左移 translate表示垂直方向，正值下移负值上移 -->
    <p>倾斜 transform:skew(xdeg,ydeg)</p>   <!-- skewX水平方向倾斜，skewY垂直方向倾斜 -->
    <p>变换原点 transform-origin:bottom left;   <!-- 原点为左下角 -->
        transform-origin:0 0;   <!-- 原点为左上角 -->
    </p>   <!-- 指定一个值将同时作用于X轴和Y轴，指定两个值则第一个值作用于X轴第二个值作用于Y轴 -->
</body>
</html>
