<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>同时使用两个类别选择器</title>
    <style type="text/css">
        .blue{
            color: blue;
        }
        .big{
            font-size: 25px;
        }
    </style>
</head>
<body>
    <p>一种都不使用</p>
    <p class="blue">使用blue</p>
    <p class="big">使用big</p>
    <p class="blue big">两种都使用</p>
</body>
</html>
