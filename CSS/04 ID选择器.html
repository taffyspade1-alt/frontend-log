<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ID选择器</title>
    <!-- 用法与类别选择器基本相同，但ID选择器只能在html页面中用一次，且不支持使用多个 -->
    <style type="text/css">
    /* 粗体 */
        #bold{
            font-weight: bold; 
        }
        #green{
            color: green;
        }
    </style>
</head>
<body>
    <p id="bold">ID选择器1</p>
    <p id="green">ID选择器2</p>
    <p id="bold green">ID选择器1和2</p> <!-- 错误写法 -->
</body>
</html>
