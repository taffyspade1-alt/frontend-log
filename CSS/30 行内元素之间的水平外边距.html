<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>行内元素之间的水平外边距</title>
    <style>
        span{
            background-color: skyblue;
            text-align: center;
            font-size: 12px;
            padding: 10px;
        }
        span.left{
            margin-right: 30px;
            background-color: purple;
        }
        span.right{
            margin-left: 40px;
            background-color: aqua;
        }
        /* 两个块之间的距离为第一个元素的margin-right+第二个元素的margin-left */
    </style>
</head>
<body>
    <span class="left">行内元素1</span><span class="right">行内元素2</span>
</body>
</html>
