<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网格布局</title>
    <style>
        body{
            font-size: 12px;
            margin: 2rem;
        }
        .container{
            display: grid;
            border: 1px solid #000;
            width: 500px;
            grid-template-rows: repeat(4,1fr);   /* 1fr表示占剩余空间的一等份 */
            grid-template-columns: repeat(5,1fr);   
            grid-template-areas: 
            "a1 a1 a1 a2 a2"
            "a1 a1 a1 a2 a2"
            "a1 a1 a1 a3 a3"
            "a4 a4 a4 a3 a3";
        }
        .item1{
            grid-area: a1;
        }
        .item2{
            grid-area: a3;
        }
        .item3{
            grid-area: a4;
        }
        .container .item{
            margin: 5px;
            background: tomato;
            line-height: 70px;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body class="container">
    <div class="item item1">1</div>
    <div class="item item2">2</div>
    <div class="item item3">3</div>
    <div class="item item4">4</div>
    <div class="item item5">5</div>
    <div class="item item6">6</div>
    <div class="item item7">7</div>
</body>
</html>
