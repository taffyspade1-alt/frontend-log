<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>设置图片边框</title>
    <style>
        .test1{
            border-style: dotted;   /* 点划线 */
            border-color: black;   /* 边框颜色 */
            border-width: 4px;   /* 边框粗细 */
        }
        .test2{
            border: 2px aqua dashed;    /* 简化写法 */
        }
        /* 单独设置每条边框：border-left border-right border-top border-bottom */
    </style>
</head>
<body>
    <img width="300" src="../html/content1/五条牢师.jpg" class="test1" alt="五条牢师">
    <img width="300" src="../html/content1/老杨.png" class="test2" alt="老杨">
</body>
</html>
