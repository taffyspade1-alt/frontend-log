<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSS基本结构</title>
    <!--
    2级标题{
        字体：黑体；
        大小：20像素；
        颜色：蓝色；
        装饰：下划线；
    } 
     -->
    <style>
    h2{
        font-family: 黑体;
        font-size: 20px;
        color: blue;
        text-decoration: underline;
    }
    </style>
</head>
<body>
    <h2>标题1</h2>
    <p>内容1</p>
    <h2>标题2</h2>
    <p>内容2</p>
    <h2>标题3</h2>
    <p>内容3</p>
</body>
</html>
