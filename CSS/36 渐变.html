<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>渐变</title>
    <style>
        #grad{
            width: 500px;
            height: 100px;
            font-size: 20px;
            line-height: 100px;
            text-align: center;
            margin: 20px;
            background-image: linear-gradient(to bottom,skyblue,rgb(210, 210, 241));
            /* 两个颜色的渐变 */
            background-image: linear-gradient(to bottom,skyblue,rgb(210, 210, 241),aqua);
            /* 三个的颜色渐变 */
        }
    </style>
</head>
<body>
    <div id="grad">给一个div块添加渐变背景</div>
</body>
</html>
