<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>项目列表</title>
    <style>
    li{
        font-size: 0.9em;
        color: #00458c;
        list-style-type: decimal;   /* 项目编号 */
        /* disc实心圆 circle空心圆 */
    }
    li.special{
        font-size: 0.9em;
        color: #00458c;
        list-style-type: none;   /* 不显示项目符号 */
        background: url(../html/content1/0d00\(1\).png ) no-repeat;   /* 把项目符号设置为图片 */
        padding-left: 25px;
    }
    
    </style>
</head>
<body>
    <li>Home</li>
    <li>Contact us</li>
    <li>Web Dev</li>
    <li>Web Design</li>
    <li class="special">Map</li>
</body>
</html>
