<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数独游戏</title>
    <style>
        h1{
            text-align: center;
        }
        p{
            font: 12px/18px;
            text-indent: 2em;
        }
        td{
            padding: 0px;
            width: 30px;
            height: 30px;
            border: 1px #999 solid;
        }
        table{
            border-collapse: collapse;
            border: 2px #666 solid;
            margin: 0 auto;
        }
        .vline{
            border-left: 2px #666 solid;
        }
        .bline{
            border-bottom: 2px #666 solid;
        }
        td{
            padding: 0px;
            width: 30px;
            height: 30px;
            text-align: center;
            vertical-align: middle;
            font-size: 21px;
            font-family: 'Times New Roman', Times, serif;
        }
        input{
            margin: 1px 0 0 0;
            padding: 0;
            height: 27px;
            width: 24px;
            text-align: center;
            vertical-align: middle;
            font-family: "lucida handwriting";
            color: blue;
            border: none;
        }
    </style>
</head>
<body>
    <h1>数独游戏</h1>
    <p>
        在9×9的大九宫格中有三个3×3的小九宫格，小九宫格中已经有一些数字在里面了，根据这些数字，
        运用逻辑与推理，在其他空格中填入1到9的数字，要保证每个数字在小九宫格中不重复，同时，
        每行每列中也不能有重复的数字
    </p>
    <table>
        <tr>
            <td>5</td><td>3</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td>7</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
        </tr>
        <tr>
            <td>6</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline">1</td><td>9</td><td>5</td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
        </tr>
        <tr class="bline">
            <td><input class="entey" name="Text1" type="text" maxlength="1"></td><td>9</td><td>8</td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td>6</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
        </tr>
        <tr>
            <td>8</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td>6</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td>3</td>
        </tr>
        <tr>
            <td>4</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline">8</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td>3</td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td>1</td>
        </tr>
        <tr class="bline">
            <td>7</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td>2</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td>6</td>
        </tr>
        <tr>
            <td><input class="entey" name="Text1" type="text" maxlength="1"></td><td>6</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline">2</td><td>8</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
        </tr>
        <tr>
            <td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline">4</td><td>1</td><td>9</td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td>5</td>
        </tr>
        <tr>
            <td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td>8</td><td><input class="entey" name="Text1" type="text" maxlength="1"></td>
            <td class="vline"><input class="entey" name="Text1" type="text" maxlength="1"></td><td>7</td><td>9</td>
        </tr>
    </table>

</body>
</html>
