<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式栅格系统</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .container{
            width: 100%;
        }
        .container .row>.col{
            padding: 1rem;
            background-color: aliceblue;
            border: 1px solid gray;
            font-size: 1.25rem;
        }
        .row{
            display: flex;
            flex-wrap: wrap;
            width: 100%;
        }
        .col-sma-6{
            flex: 0 0 50%;
        }
        @media(min-width:768px){
            .col-mid-2{
                flex:0 0 16.6667%;
            }
        }
        @media(min-width:1024px){
            .col-big-1{
                flex: 0 0 8.33334%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col col-sma-6 col-mid-2 col-big-1">col 1</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 2</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 3</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 4</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 5</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 6</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 7</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 8</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 9</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 10</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 11</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 12</div>
            <div class="col col-sma-6 col-mid-2 col-big-1">col 13</div>
        </div>
    </div>
</body>
</html>
