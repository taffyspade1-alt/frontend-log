<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 获得日期对象
    const date = new Date()
    // 使用方法
    console.log(date.getFullYear())
    console.log(date.getMonth() + 1)    /* 月份的取值为0-11，需要+1 */
    console.log(date.getDate())
    console.log(date.getDay())    /* 星期0-6,星期日为0 */
  </script>
</body>
</html>
