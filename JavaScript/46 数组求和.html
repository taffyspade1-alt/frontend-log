<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let arr = [2,6,1,7,4]
    let sum = 0
    let avg
    for (let i = 0;i < arr.length;i++){
      sum += arr[i]   /* 求和 */
    }
    avg = sum / arr.length
    document.write(`和为${sum},平均值为${avg}`)
  </script>
</body>
</html>
