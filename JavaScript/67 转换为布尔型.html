<body>
  <script>
    // "空字符串,0,undefined,null,false,NaN转换为布尔型为false，其余为true"
    console.log(Boolean(undefined))
    console.log(Boolean(''))
    // 1.有字符串的加法为拼接 2.减法只用于数字,空字符串转换为0 3.null数字转换后为0 4.undefined数字转换后为NaN
  </script>
