<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function getSum(){
      let sum = 0
      // arguments伪数组，动态参数，只能存在于函数内
      for(let i = 0;i < arguments.length;i++){
      sum += arguments[i]
      }
      return sum
    }
  console.log(getSum(1,2,3,4))
  </script>
</body>
</html>
