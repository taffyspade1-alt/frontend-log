<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // arr.pop()删除数组中的最后一个元素，并返回该元素的值
    let arr = [1,5,9,85,15,56]
    arr.pop()   /* 56 */
    console.log(arr)
    // arr.shift()删除第一个元素并返回值
    arr.shift()   /* 1 */
    console.log(arr)
    // arr.splice(起始位置,删除几个元素 不写则删到最后)
    arr.splice(0,1)   /* 5 */
    console.log(arr)
  </script>
</body>
</html>
