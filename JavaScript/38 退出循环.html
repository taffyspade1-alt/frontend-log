    let i = 1
    while (i <= 5){
      if (i === 3){
        i++
        continue   /* 结束本次循环 继续下一轮循环 */
      }
      document.write(`我要吃${i}个包子`)
      i++
    }
    // continue用于排除或跳过某一项，break用于找到结果后续循环不需要继续
  </script>
