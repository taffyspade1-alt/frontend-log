<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 文档输出内容
    document.write('我是div标签')
    document.write('<h1>我是标题</h1>')   /* 可识别内部标签 */
    // 弹出对话框
    alert('弹出对话框')
    // 控制台打印输出
    console.log('仅控制台可见')
    // 对话框输入
    prompt('请输入文本')   /* 弹出一个提示输入的对话框 */
  </script>

</body>
</html>
