<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let grade = +prompt('请输入成绩')
    if (grade >= 90){
      alert('优秀')
    } else if (grade >=70 && grade<90){
      alert('良好')
    } else if (grade >= 60 && grade < 70){
      alert('及格')
    } else {
      alert('不及格')
    }
  </script>
</body>
</html>
