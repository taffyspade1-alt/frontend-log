<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // for (变量起始值;中止条件;变化量){
    //   // 循环体
    // }
    let num = 0
    for (let i =1;i<=100;i++){
      if(i % 2 === 0){
        num += i
      }
    }
    document.write(`偶数和为${num}`)
  </script>
</body>
</html>
