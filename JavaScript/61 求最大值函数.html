<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 求最大值函数
    function getMax(x = 0,y = 0){
      return x > y ? x : y
    }
    let num1 = getMax(5,10)
    console.log(num1)
    // 求数组最大值最小值
    function getArrMax(arr = []){
      let max = arr[0]
      let min = arr[0]
      // 求最大值
      for (let i = 1;i < arr.length;i++){
        if (max < arr[i]){
          max = arr[i]
        }
      }
      for (let i = 1;i < arr.length;i++){
        if (min > arr[i]){
          min = arr[i]
        }
      return [min,max]
      }
    }
     let re = getArrMax([1,55,26,87,12,6])
     console.log(re)
  </script>
</body>
</html>
