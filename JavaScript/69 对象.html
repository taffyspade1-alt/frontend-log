<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对象</title>
</head>
<body>
  <script>
    // 语法：let 对象名 = {
    // 属性名:属性值,
    // 方法名:函数
    // }
    let goods ={
      name: '小米10青春版',
      num: 100012816024,
      weight: '0.55kg',
      address: '中国大陆'
    }
    // 查   1.对象名.属性 2.对象名['属性名']
    console.log(goods.address)
    console.log(goods['weight'])
    // 改   对象名.属性 = 新值
    goods.weight = '0.99kg'
    // 增   对象名.新属性 = 新值
    goods.other = '666'
    // 删   delete 对象名.属性
    delete goods.other
    console.log(goods)
  </script>
</body>
</html>
