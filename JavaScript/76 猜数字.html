<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function getRandom(n,m){
      return Math.floor(Math.random() * (m - n + 1) + n)
    }
    let num = getRandom(1,10)
    while(1){
      let input = +prompt('请输入一个数字，范围1-10')
      if (input > num){
        alert('猜大了')
      } else if(input < num){
        alert('猜小了')
      } else if(input === num){
        alert('猜对了')
        break
      } else{
        alert('请输入正确的数字')
      }
    }
  </script>
</body>
</html>
