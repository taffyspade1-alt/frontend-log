<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    console.log(3 >= 3)
    // ==只判断值
    console.log(2 == '2')   /* 比较运算符会隐式转换 */
    // ===判断值和数据类型
    console.log(2 === '2')
    console.log(NaN === NaN)   /* NaN不等于任何 */
    console.log('a' < 'b')   /* 字符串比较：比较ASCLL码 */
    console.log('aa' < 'ab')   /* 从左往右依次比较 */
  </script>
</body>
</html>
