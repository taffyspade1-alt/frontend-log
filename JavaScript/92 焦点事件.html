<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      display: none;
      width: 80px;
      height: 80px;
      background-color: skyblue;
    }
    input{
      background-color: aliceblue;
    }
  </style>
</head>
<body>
  <input type="search" name="搜索框" placeholder="搜索框">
  <div class="box">隐藏内容</div>
  <script>
    const div = document.querySelector('div')
    const ipt = document.querySelector('[type = search]')
    // 获得焦点
    ipt.addEventListener('focus',function(){div.style.display = 'block'})
    // 失去焦点
    ipt.addEventListener('blur',function(){div.style.display = 'none'})
  </script>
</body>
</html>
