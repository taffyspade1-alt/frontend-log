<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 方法
    // ceil向上取整
    console.log(Math.ceil(1.1))   /* 2 */
    // floor向下取整
    console.log(Math.floor(1.5))   /* 1 */
    // round四舍五入
    console.log(Math.round(1.1))   /* 1 */
  </script>
</body>
</html>
