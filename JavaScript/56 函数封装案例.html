<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function getSum(){
      let num1 = +prompt('请输入第一个数')
      let num2 = +prompt('请输入第二个数')
      let sum = num1 + num2
      document.write(`两个数的和为${sum}`)
    }
    getSum()
  </script>
</body>
