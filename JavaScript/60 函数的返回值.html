<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function fn(){
      return 20
      // 相当于执行fn() = 20
      // return直接结束函数，下面的代码不再执行
      // return没有返回值默认undefined
    }
    let re = fn()
    console.log(re)
  </script>
</body>
