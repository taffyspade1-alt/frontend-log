<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button>按钮</button>
  <script>
    // 语法：元素对象.addEvenListener('事件类型',要执行的函数)
    const btn = document.querySelector('button')
    btn.addEventListener('click',function(){
      alert('hello')
    })
  </script>
</body>
</html>
