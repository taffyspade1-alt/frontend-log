<body>
  <script>
    const getSum = (...arr) =>{
      for(let i = 0;i <= arr.length;i++){
        let sum = 0
        sum += arr[i]
      }
      return sum
    }
    const re = getSum(2,3,5)
    console.log(re)
  </script>
</body>
