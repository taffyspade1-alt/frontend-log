<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div>全选<input type="checkbox" name="check" id="cka"></div>
  <div><input type="checkbox" name="check" id="ck"></div>
  <div><input type="checkbox" name="check" id="ck"></div>
  <div><input type="checkbox" name="check" id="ck"></div>
  <script>
    // 获取大复选框
    const cka = document.querySelector('#cka')
    // 获取小复选框
    const cks = document.querySelectorAll('#ck')
    // 监听点击大复选框事件
    cka.addEventListener('click',function(){
      // 得到当前大复选框的选中状态 true/false
      console.log(cka.checked)
      // 遍历小复选框，让小复选框的选中状态=大复选框的选中状态
      for (let i = 0;i < cks.length;i++){
        cks[i].checked = cka.checked
      }
    })
    // 小复选框控制大复选框
    for (let i = 0;i < cks.length;i++){
      // 给小复选框添加点击事件
      cks[i].addEventListener('click',function(){
        // 判断小复选框的选中个数是否等于总个数
        cka.checked = document.querySelectorAll('#ck:checked').length === cks.length
      })
  }
  </script>
</body>
</html>
