<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // arr.push(元素1,元素2,...,元素n)   /* 将一个或多个元素添加在数组结尾，并返回数组的新长度 */
    let arr = ['pink','hotpink']
    arr.push('deeppink')
    console.log(arr.push('deeppink'))   /* 3 */
    // arr.unshift(元素1,元素2,...,元素n) /* 将一个或多个元素添加到数组的开头并返回新长度 */
    arr.unshift('red')
    console.log(arr)
  </script>
</body>
</html>
