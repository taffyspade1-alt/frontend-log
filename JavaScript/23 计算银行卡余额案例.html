<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算银行卡余额</title>
  <style>
    h1{
      text-align: center;
    }
    table{
      border: 1px solid black;
      border-collapse: collapse;
      height: 80px;
      margin: 0 auto;
    }
    th{
      text-align: center;
      padding: 5px 20px;
    }
  </style>
</head>
<body>
  <h1>2026年7月银行卡余额</h1>
  </table>
  <script>
    let total = +prompt('请输入银行卡总额')
    let eleCost = +prompt('请输入电费')
    let watCost = +prompt('请输入水费')
    let netCost = + prompt('请输入网费')
    let bal = total - eleCost - watCost - netCost
    document.write(`
      <table border="1">
      <thead>
        <tr>
          <th>银行卡总额</th>
          <th>水费</th>
          <th>电费</th>
          <th>网费</th>
          <th>银行卡余额</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>${total}元</th>
          <th>${watCost}元</th>
          <th>${eleCost}元</th>
          <th>${netCost}元</th>
          <th>${bal}元</th>
        </tr>
      </tbody>
    `)
  </script>
</body>
</html>
