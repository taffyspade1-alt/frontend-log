<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input type="text" name="" id="">
  <script>
    const input = document.querySelector('input')
    input.addEventListener('keyup',function(e){
      if(e.key === 'Enter'){
        console.log('按下了回车键')
      }
    })
  </script>
</body>
</html>
