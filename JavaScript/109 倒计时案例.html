<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div></div>
  <script>
    function fn(){
    const now = +new Date()
    const last = +new Date('2026-9-18 18:30:00')
    const count = (last - now) /1000    /* 得到相差的秒数 */   
      let h = parseInt(count / 3600 % 24)
      let m = parseInt(count / 60 % 60)
      let s = parseInt(count % 60)
      h = h < 10 ? '0' + h : h 
      m = m < 10 ? '0' + m : m 
      s = s < 10 ? '0' + s : s 
    const div = document.querySelector('div')
    div.innerHTML = `${h}:${m}:${s}`
  }
    setInterval(fn,1000)
  </script>
</body>
</html>
