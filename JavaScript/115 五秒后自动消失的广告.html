<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div{
      background-color: pink;
      width: 200px;
      height: 200px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div>我是广告</div>
  <script>
    const div = document.querySelector('div')
    setTimeout(function(){
      div.style.display = 'none'
    },5000)
  </script>
</body>
</html>
