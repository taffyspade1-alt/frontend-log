<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 捕获：父到子（大到小） 冒泡：子到父
    DOM.addEventListener(事件类型,事件处理函数,是否使用捕获机制)
    // 第三个参数传入true代表捕获，false代表冒泡（默认是false）
    // 事件冒泡：当一个元素触发事件后，会依次向上调用所有父级元素的同名事件
  </script>
</body>
</html>
