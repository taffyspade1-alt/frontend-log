<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    console.log('pink' + 1)   /* 加号两边有一个字符串类型就会把另一个也转换为字符串 */
    console.log(2 - '2')   /* 减乘除会把数据转成数字类型 */
    console.log(+'111')   /* 加号作为正号的时候会把数据转成数字型 */
  </script>
</body>
</html>
