<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function findIndex(a = 0,arr = []){
      let index
      for(i = 0;i < arr.length;i++){
        if (a === arr[i]){
          index = i
          break
        } else{
          index = -1
        }
      }
      return index
    }
    let re = findIndex('滚木',['苹果','香蕉','橘子','荔枝'])
    console.log(re)
  </script>
</body>
</html>
