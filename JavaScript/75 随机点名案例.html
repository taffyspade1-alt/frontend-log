<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let arr = ['赵云','黄忠','关羽','张飞','马超','刘备','曹操']
    // 得到一个随机数作为数组索引号
    let i = Math.floor(Math.random() * arr.length)
    // 页面输出数组里的元素
    console.log(arr[i])
    // 删除打印过的元素
    arr.splice(i,1)
  </script>
</body>
</html>
