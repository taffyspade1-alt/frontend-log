<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // setInterval(函数名,间隔时间（单位ms）)
    function fn(){
      console.log('每秒执行一次')
    }
    // 开启定时器
    // setInterval(fn,1000)
    // 关闭定时器 clearInterval(变量名)
    let n = setInterval(fn,1000)
    clearInterval(n)
  </script>
</body>
</html>
